<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>한글 모아모아 도우미</title>
  <link rel="stylesheet" href="css/style.css?v=20261004-2">
</head>
<body>
  <!-- 상단 도구 막대: 입력 · 상태 · 능력 보유 수 -->
  <header class="toolbar">
    <h1>한글 모아모아 도우미</h1>
    <div class="tool-group">
      <button id="btn-share" class="primary">게임 창 공유 시작</button>
      <button id="btn-capture" disabled title="단축키 R · 이번 턴 계획을 새로 계산합니다">지금 분석 (R)</button>
      <label class="check"><input type="checkbox" id="chk-auto" disabled> 자동 분석</label>
      <label class="file-btn">스크린샷 열기<input type="file" id="file-input" accept="image/*" hidden></label>
    </div>
    <div class="tool-group abilities">
      <label>점 찍기 <input type="number" id="opt-dot" min="0" max="7" value="0"></label>
      <label>바꿔 뽑기 <input type="number" id="opt-reroll" min="0" max="7" value="0"></label>
      <label class="check" title="버튼 옆 숫자를 화면에서 자동으로 읽습니다"><input type="checkbox" id="opt-auto-ab" checked> 화면에서 읽기</label>
    </div>
    <p class="status" id="status">대기 중 · 게임 창을 공유하거나 스크린샷을 붙여넣으세요 (Ctrl+V)</p>
  </header>

  <main class="layout">
    <!-- 추천: 화면의 주 영역 -->
    <section class="panel" id="panel-result">
      <div id="summary" class="summary">조각이 인식되면 추천이 표시됩니다.</div>
      <div id="steps" class="steps"></div>
      <div id="extras" class="extras"></div>
      <div id="advice" class="advice"></div>
    </section>

    <!-- 인식 결과 · 설정 · 캡처 화면 -->
    <aside class="side">
      <section class="panel" id="panel-state">
        <h2>인식 결과 <span class="hint">클릭: 블록 · 우클릭: 아이템</span></h2>
        <div class="state-grid">
          <canvas id="board-edit" class="board-canvas"></canvas>
          <div class="slots" id="slots"></div>
        </div>
      </section>

      <details class="panel fold" id="log-box">
        <summary>로그 <span class="hint" id="log-count">0건</span></summary>
        <label class="check"><input type="checkbox" id="opt-log" checked> 분석할 때마다 기록</label>
        <p class="hint">보드·조각·능력·점수와 추천을 브라우저에 저장합니다 (최대 5,000건). 내보낸 파일로 조각 분포와 추천 결과를 분석할 수 있습니다.</p>
        <div class="btn-row">
          <button id="btn-log-export">JSON 내보내기</button>
          <button id="btn-log-clear">비우기</button>
        </div>
      </details>

      <details class="panel fold" id="preview-box">
        <summary>캡처 화면 · 보드 영역 지정</summary>
        <div class="preview-wrap" id="preview-wrap">
          <canvas id="preview"></canvas>
          <div class="preview-empty" id="preview-empty">캡처한 화면이 여기에 표시됩니다.<br>끌어놓기도 됩니다.</div>
        </div>
        <div class="btn-row">
          <button id="btn-calib" disabled>보드 영역 직접 지정</button>
          <button id="btn-calib-reset" disabled>자동 감지로 복귀</button>
        </div>
      </details>
    </aside>
  </main>

  <video id="video" muted playsinline hidden></video>
  <script src="js/pieces.js?v=20261004-4"></script>
  <script src="js/solver-wasm.js?v=20261004-4"></script>
  <script src="js/solver.js?v=20261004-4"></script>
  <script src="js/vision.js?v=20261004-4"></script>
  <script src="js/app.js?v=20261004-4"></script>
</body>
</html>
